<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件导入服务</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        /* 顶部导航：在“文件导入”和“问答”两个页面之间跳转 */
        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 14px;
            margin-bottom: 10px;
            border-bottom: 1px solid #e6e9ef;
        }
        .nav-brand {
            font-weight: 600;
            color: #2c3e50;
            font-size: 15px;
        }
        .nav-link {
            text-decoration: none;
            font-size: 13px;
            color: #fff;
            background-color: #3498db;
            padding: 8px 14px;
            border-radius: 6px;
            transition: background-color 0.3s;
        }
        .nav-link:hover {
            background-color: #2980b9;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }
        .upload-area {
            border: 2px dashed #3498db;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-bottom: 20px;
        }
        .upload-area:hover {
            background-color: #ecf6fd;
        }
        .upload-icon {
            font-size: 48px;
            color: #3498db;
            margin-bottom: 10px;
        }
        .file-input {
            display: none;
        }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        .file-list {
            margin-top: 30px;
        }
        .file-item {
            background-color: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .file-info {
            display: flex;
            flex-direction: column;
            flex: 1;
            margin-right: 20px;
        }
        .file-name {
            font-weight: 600;
            color: #333;
        }
        .file-size {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 4px;
        }
        .status-badge {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            min-width: 80px;
            text-align: center;
        }
        .status-uploading { background-color: #f39c12; }
        .status-processing { background-color: #3498db; }
        .status-completed { background-color: #2ecc71; }
        .status-error { background-color: #e74c3c; }
        
        /* 简单的进度条 */
        .progress-bar-container {
            width: 100%;
            height: 4px;
            background-color: #f0f0f0;
            margin-top: 8px;
            border-radius: 2px;
            overflow: hidden;
            display: none;
        }
        .progress-bar {
            height: 100%;
            background-color: #f39c12;
            width: 0%;
            transition: width 0.3s, background-color 0.3s;
        }

        /* 任务日志（可展开/收起） */
        .log-details {
            margin-top: 8px;
            font-size: 12px;
            color: #7f8c8d;
        }
        .log-details summary {
            cursor: pointer;
            user-select: none;
            color: #6c7a89;
        }
        .log-list {
            margin: 6px 0 0 16px;
            padding: 0;
        }
        .log-list li {
            margin: 2px 0;
            line-height: 1.4;
        }

        /* 文档版本 / 时效性 元信息表单 */
        .meta-panel {
            margin-bottom: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px 16px;
            background-color: #fbfdff;
        }
        .meta-panel summary {
            cursor: pointer;
            color: #2c3e50;
            font-weight: 600;
        }
        .meta-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px 20px;
            margin-top: 12px;
        }
        .meta-field {
            display: flex;
            flex-direction: column;
            font-size: 13px;
            color: #57606f;
        }
        .meta-field input {
            margin-top: 6px;
            padding: 8px 10px;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            font-size: 14px;
        }

        /* 已导入文档管理（列表 + 选择删除） */
        .doc-panel {
            margin-bottom: 24px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px 16px;
            background-color: #fbfdff;
        }
        .doc-panel summary {
            cursor: pointer;
            color: #2c3e50;
            font-weight: 600;
        }
        .doc-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0 8px;
            font-size: 13px;
            color: #57606f;
        }
        .btn-sm {
            padding: 7px 12px;
            font-size: 13px;
            border-radius: 6px;
        }
        .btn-danger {
            background-color: #e74c3c;
        }
        .btn-danger:hover {
            background-color: #c0392b;
        }
        .btn-ghost {
            background-color: transparent;
            color: #3498db;
            border: 1px solid #3498db;
        }
        .btn-ghost:hover {
            background-color: #ecf6fd;
        }
        .doc-list {
            max-height: 320px;
            overflow-y: auto;
            border-top: 1px solid #eef1f5;
        }
        .doc-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 4px;
            border-bottom: 1px solid #eef1f5;
            font-size: 13px;
        }
        .doc-row:last-child { border-bottom: none; }
        .doc-row input[type="checkbox"] {
            width: 16px;
            height: 16px;
            flex: 0 0 auto;
        }
        .doc-info {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
        }
        .doc-title {
            font-weight: 600;
            color: #333;
            word-break: break-all;
        }
        .doc-meta {
            color: #7f8c8d;
            font-size: 12px;
            margin-top: 3px;
            word-break: break-all;
        }
        .doc-actions {
            flex: 0 0 auto;
        }
        .doc-empty {
            color: #95a5a6;
            font-size: 13px;
            padding: 12px 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-bar">
        <span class="nav-brand">智汇智库知识库</span>
        <a class="nav-link" id="navQuery" href="#">💬 进入问答</a>
    </div>
    <h1>📄 知识库文件导入</h1>
    
    <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">☁️</div>
        <p>点击或拖拽文件到此处（PDF / MD / 图片 / Office，单文件 ≤ 200MB、≤ 200 页）</p>
        <input type="file" id="fileInput" class="file-input" multiple
               accept=".pdf,.md,.png,.jpg,.jpeg,.jp2,.webp,.gif,.bmp,.doc,.docx,.ppt,.pptx,.xls,.xlsx">
    </div>

    <!-- 文档版本 / 时效性 元信息（随上传一起提交，可留空） -->
    <details class="meta-panel" open>
        <summary>文档版本与时效信息（可选，留空则自动判定）</summary>
        <div class="meta-grid">
            <label class="meta-field">
                <span>文档ID（同一逻辑文档跨版本保持一致）</span>
                <input type="text" id="metaDocId" placeholder="留空则用文件名归一">
            </label>
            <label class="meta-field">
                <span>版本说明</span>
                <input type="text" id="metaVersionNote" placeholder="如：2025 年修订版">
            </label>
            <label class="meta-field">
                <span>来源部门</span>
                <input type="text" id="metaSourceDept" placeholder="如：研发部 / 市场部">
            </label>
            <label class="meta-field">
                <span>生效日期</span>
                <input type="date" id="metaPublishDate">
            </label>
            <label class="meta-field">
                <span>失效日期（留空=长期有效）</span>
                <input type="date" id="metaExpireDate">
            </label>
        </div>
    </details>

    <div id="fileList" class="file-list">
        <!-- 文件列表将在这里生成 -->
    </div>

    <!-- 已导入知识库文档管理：列表 + 选择删除 -->
    <details class="doc-panel" open>
        <summary>🗂 已导入知识库文档（可勾选后删除）</summary>
        <div class="doc-toolbar">
            <span id="docSummary">正在加载文档列表...</span>
            <span>
                <button class="btn btn-sm btn-ghost" id="docRefreshBtn" type="button">刷新列表</button>
                <button class="btn btn-sm btn-danger" id="docDeleteBtn" type="button">删除选中文档</button>
            </span>
        </div>
        <div class="doc-list" id="docList">
            <div class="doc-empty">加载中...</div>
        </div>
    </details>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    
    // 导入服务 API 地址：优先沿用当前页面访问源（页面由导入服务自身提供），
    // 直接以文件方式打开时回退到默认的 127.0.0.1:8000
    const API_BASE = (location.origin && location.origin.startsWith('http'))
        ? location.origin
        : 'http://127.0.0.1:8000';

    // 问答服务（查询服务）地址：端口固定为 8001，主机名沿用当前访问主机，便于跨机访问
    const QUERY_BASE = `http://${location.hostname || '127.0.0.1'}:8001`;
    // 顶部导航跳转到问答页面
    document.getElementById('navQuery').href = `${QUERY_BASE}/chat.html`;

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.backgroundColor = '#ecf6fd';
    });

    dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dropZone.style.backgroundColor = '';
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.backgroundColor = '';
        handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => {
        handleFiles(e.target.files);
    });

    // 与后端保持一致的上限：单文件 ≤200MB；支持类型同 MinerU（PDF/MD/图片/Office）
    const MAX_FILE_SIZE_MB = 200;
    const ALLOWED_EXTENSIONS = ['.pdf', '.md', '.png', '.jpg', '.jpeg', '.jp2', '.webp', '.gif', '.bmp',
        '.doc', '.docx', '.ppt', '.pptx', '.xls', '.xlsx'];

    function handleFiles(files) {
        Array.from(files).forEach((file) => {
            const ext = '.' + file.name.split('.').pop().toLowerCase();
            // 1. 类型校验（前端先拦截，后端节点仍会二次校验）
            if (!ALLOWED_EXTENSIONS.includes(ext)) {
                alert(`不支持的文件类型：${file.name}，仅支持 PDF/MD、图片与 Office 文档`);
                return;
            }
            // 2. 大小校验（≤200MB）
            if (file.size > MAX_FILE_SIZE_MB * 1024 * 1024) {
                alert(`文件过大：${file.name}（${(file.size / 1024 / 1024).toFixed(2)}MB），单文件上限 ${MAX_FILE_SIZE_MB}MB`);
                return;
            }
            // 3. 页数上限（≤200页）由后端解析时校验
            uploadFile(file);
        });
    }

    function updateProgressBar(bar, percentage) {
        bar.style.width = percentage + '%';
        if (percentage >= 100) {
            bar.style.backgroundColor = '#3498db'; // 蓝色
        } else {
            bar.style.backgroundColor = '#f39c12'; // 橘红色
        }
    }

    async function uploadFile(file) {
        // 创建文件项UI
        const id = 'file-' + Math.random().toString(36).substr(2, 9);
        const html = `
            <div class="file-item" id="${id}">
                <div class="file-info">
                    <span class="file-name">${file.name}</span>
                    <span class="file-size">${(file.size / 1024).toFixed(2)} KB</span>
                    <div class="progress-bar-container">
                        <div class="progress-bar"></div>
                    </div>
                    <details class="log-details">
                        <summary>日志（点击展开）</summary>
                        <ul class="log-list"></ul>
                    </details>
                </div>
                <div class="status-badge status-uploading">上传中...</div>
            </div>
        `;
        fileList.insertAdjacentHTML('afterbegin', html);
        const itemEl = document.getElementById(id);
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressBar = itemEl.querySelector('.progress-bar');
        const progressContainer = itemEl.querySelector('.progress-bar-container');
        const logDetails = itemEl.querySelector('.log-details');
        const logSummary = itemEl.querySelector('.log-details summary');
        const logListEl = itemEl.querySelector('.log-list');

        // 构建FormData
        const formData = new FormData();
        formData.append('files', file);
        // 追加文档版本与时效性元信息（可留空）
        const metaDocId = document.getElementById('metaDocId').value.trim();
        const metaVersionNote = document.getElementById('metaVersionNote').value.trim();
        const metaSourceDept = document.getElementById('metaSourceDept').value.trim();
        const metaPublishDate = document.getElementById('metaPublishDate').value;
        const metaExpireDate = document.getElementById('metaExpireDate').value;
        if (metaDocId) formData.append('doc_id', metaDocId);
        if (metaVersionNote) formData.append('version_note', metaVersionNote);
        if (metaSourceDept) formData.append('source_dept', metaSourceDept);
        if (metaPublishDate) formData.append('publish_date', metaPublishDate);
        if (metaExpireDate) formData.append('expire_date', metaExpireDate);

        try {
            // 1. 上传文件
            progressContainer.style.display = 'block';
            // 模拟上传进度
            updateProgressBar(progressBar, 50);

            const response = await fetch(`${API_BASE}/upload`, {
                method: 'POST',
                body: formData
            });

            if (!response.ok) throw new Error('Upload failed');
            
            const result = await response.json();
            const taskId = result.task_ids[0]; // 假设一次传一个或取第一个

            // 上传完成，进入处理中，进度固定为30%
            updateProgressBar(progressBar, 30);
            statusBadge.textContent = '处理中...';
            statusBadge.className = 'status-badge status-processing';

            // 2. 轮询状态
            pollStatus(taskId, itemEl);

        } catch (error) {
            console.error(error);
            statusBadge.textContent = '失败';
            statusBadge.className = 'status-badge status-error';
        }
    }

    function normalizeDoneLog(text) {
        // 后端可能返回中文节点名，也可能已拼接“已完成”
        if (typeof text !== 'string') return String(text);
        return text.endsWith('已完成') ? text : `${text}已完成`;
    }

    function normalizeRunningLog(text) {
        // 后端可能返回中文节点名，也可能已拼接“正在进行.../处理中...”
        if (typeof text !== 'string') return String(text);
        if (text.startsWith('正在进行')) return text.endsWith('...') ? text : `${text}...`;
        return `正在进行${text}...`;
    }

    function renderLogs(itemEl, doneList, runningList) {
        const logSummary = itemEl.querySelector('.log-details summary');
        const logListEl = itemEl.querySelector('.log-list');
        const logDetails = itemEl.querySelector('.log-details');

        const done = Array.isArray(doneList) ? doneList : [];
        const running = Array.isArray(runningList) ? runningList : [];

        // 更新 summary（即使收起也能看到进度）
        logSummary.textContent = `日志（已完成${done.length}，进行中${running.length}，点击展开）`;

        // 清空并重建列表
        logListEl.innerHTML = '';
        const lines = [
            ...done.map(normalizeDoneLog),
            ...running.map(normalizeRunningLog),
        ];

        if (lines.length === 0) {
            const li = document.createElement('li');
            li.textContent = '暂无日志';
            logListEl.appendChild(li);
        } else {
            for (const line of lines) {
                const li = document.createElement('li');
                li.textContent = line;
                logListEl.appendChild(li);
            }
        }

        // 如果没有任何日志，默认收起；否则保持用户选择
        if (lines.length === 0) {
            logDetails.open = false;
        }
    }

    function pollStatus(taskId, itemEl) {
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressBar = itemEl.querySelector('.progress-bar');
        
        const interval = setInterval(async () => {
            try {
                const res = await fetch(`${API_BASE}/status/${taskId}`);
                const data = await res.json();

                // 渲染日志（done/running）
                renderLogs(itemEl, data.done_list, data.running_list);
                
                if (data.status === 'completed') {
                    statusBadge.textContent = '已完成';
                    statusBadge.className = 'status-badge status-completed';
                    updateProgressBar(progressBar, 100);
                    clearInterval(interval);
                    // 导入完成后刷新已导入文档列表
                    loadDocuments();
                } else if (data.status === 'processing') {
                    // 保持处理中状态
                    statusBadge.textContent = '处理中...';
                    // 确保进度为30%
                     updateProgressBar(progressBar, 30);
                } else if (data.status === 'failed') {
                    statusBadge.textContent = '失败';
                    statusBadge.className = 'status-badge status-error';
                    clearInterval(interval);
                }
            } catch (e) {
                console.error('Polling error', e);
            }
        }, 2000); // 每2秒轮询一次
    }

    // ==================== 已导入文档管理：列表 + 选择删除 ====================
    const docListEl = document.getElementById('docList');
    const docSummaryEl = document.getElementById('docSummary');
    let docItems = [];  // 当前文档列表缓存

    // HTML 转义，避免文档标题中的特殊字符破坏页面结构
    function escapeHtml(text) {
        return String(text == null ? '' : text)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // epoch 秒 -> yyyy-MM-dd（0 表示长期有效）
    function formatDate(epochSeconds) {
        const ts = Number(epochSeconds) || 0;
        if (ts <= 0) return '长期有效';
        const d = new Date(ts * 1000);
        const pad = (n) => (n < 10 ? '0' + n : '' + n);
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    function renderDocuments(items) {
        if (!items || items.length === 0) {
            docListEl.innerHTML = '<div class="doc-empty">知识库中暂无已导入文档</div>';
            docSummaryEl.textContent = '共 0 篇文档';
            return;
        }
        const rows = items.map((doc) => {
            const key = escapeHtml(doc.key);
            const kind = escapeHtml(doc.kind);
            const version = doc.latest_version ? `v${doc.latest_version}` : '历史文档';
            const dept = doc.source_dept ? `｜来源：${escapeHtml(doc.source_dept)}` : '';
            const expire = `｜失效：${escapeHtml(formatDate(doc.expire_date))}`;
            return `
                <div class="doc-row" data-kind="${kind}" data-key="${key}">
                    <input type="checkbox" class="doc-check">
                    <div class="doc-info">
                        <span class="doc-title">${escapeHtml(doc.file_title || doc.doc_id || doc.item_name)}</span>
                        <span class="doc-meta">主体：${escapeHtml(doc.item_name || '未识别')}｜${version}｜切片：${doc.chunk_count}${dept}${expire}</span>
                    </div>
                    <div class="doc-actions">
                        <button class="btn btn-sm btn-danger doc-del-one" type="button">删除</button>
                    </div>
                </div>`;
        });
        docListEl.innerHTML = rows.join('');
        docSummaryEl.textContent = `共 ${items.length} 篇文档`;
    }

    async function loadDocuments() {
        docSummaryEl.textContent = '正在加载文档列表...';
        try {
            const res = await fetch(`${API_BASE}/documents`);
            const data = await res.json();
            docItems = data.items || [];
            renderDocuments(docItems);
        } catch (e) {
            console.error('加载文档列表失败', e);
            docListEl.innerHTML = '<div class="doc-empty">文档列表加载失败，请点击“刷新列表”重试</div>';
            docSummaryEl.textContent = '加载失败';
        }
    }

    async function deleteDocuments(targets) {
        // targets: [{kind, key}, ...]
        if (!targets.length) {
            alert('请先勾选要删除的文档');
            return;
        }
        const names = targets.map((t) => t.key).join('、');
        if (!confirm(`确认删除以下 ${targets.length} 篇文档？\n${names}\n\n删除后该文档的全部切片与版本记录将被移除，且不可恢复。`)) {
            return;
        }
        let okCount = 0;
        const failed = [];
        for (const t of targets) {
            try {
                const url = `${API_BASE}/documents?kind=${encodeURIComponent(t.kind)}&key=${encodeURIComponent(t.key)}`;
                const res = await fetch(url, { method: 'DELETE' });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.detail || `HTTP ${res.status}`);
                }
                okCount += 1;
            } catch (e) {
                console.error('删除失败', t, e);
                failed.push(`${t.key}（${e.message}）`);
            }
        }
        if (failed.length) {
            alert(`成功删除 ${okCount} 篇，失败 ${failed.length} 篇：\n${failed.join('\n')}`);
        } else {
            alert(`已成功删除 ${okCount} 篇文档`);
        }
        loadDocuments();
    }

    // 单篇删除
    docListEl.addEventListener('click', (e) => {
        const btn = e.target.closest('.doc-del-one');
        if (!btn) return;
        const row = btn.closest('.doc-row');
        deleteDocuments([{ kind: row.dataset.kind, key: row.dataset.key }]);
    });

    // 批量删除选中
    document.getElementById('docDeleteBtn').addEventListener('click', () => {
        const targets = Array.from(docListEl.querySelectorAll('.doc-row'))
            .filter((row) => row.querySelector('.doc-check').checked)
            .map((row) => ({ kind: row.dataset.kind, key: row.dataset.key }));
        deleteDocuments(targets);
    });

    // 手动刷新
    document.getElementById('docRefreshBtn').addEventListener('click', loadDocuments);

    // 页面加载时拉取文档列表
    loadDocuments();
</script>

</body>
</html>
